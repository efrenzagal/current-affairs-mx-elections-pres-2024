<meta charset="utf-8" />
<title>Warehouse Data Dictionary</title>
<style>
:root{
  --bg:#f3f4f0;
  --surface:#ffffff;
  --surface-2:#eceee8;
  --text:#1b211d;
  --text-muted:#5c6660;
  --accent:#2f5d50;
  --accent-strong:#204238;
  --accent-soft:#dde8e1;
  --border:#d7dbd3;
  --mono-tint:#f0efe9;
  --pk:#a8632c;
  --pk-soft:#f3e4d3;
  --raw:#6b5a9a;
  --raw-soft:#e7e2f2;
  --font-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:"SF Mono",ui-monospace,"Cascadia Code","Roboto Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12140f;
    --surface:#191c15;
    --surface-2:#20241b;
    --text:#e7ebe2;
    --text-muted:#9aa596;
    --accent:#7ec0a6;
    --accent-strong:#a3d8c1;
    --accent-soft:#213a30;
    --border:#2c332a;
    --mono-tint:#1c2018;
    --pk:#e0a45f;
    --pk-soft:#3a2c1a;
    --raw:#b7a6e0;
    --raw-soft:#2b2540;
  }
}
:root[data-theme="dark"]{
  --bg:#12140f; --surface:#191c15; --surface-2:#20241b; --text:#e7ebe2;
  --text-muted:#9aa596; --accent:#7ec0a6; --accent-strong:#a3d8c1;
  --accent-soft:#213a30; --border:#2c332a; --mono-tint:#1c2018;
  --pk:#e0a45f; --pk-soft:#3a2c1a; --raw:#b7a6e0; --raw-soft:#2b2540;
}
:root[data-theme="light"]{
  --bg:#f3f4f0; --surface:#ffffff; --surface-2:#eceee8; --text:#1b211d;
  --text-muted:#5c6660; --accent:#2f5d50; --accent-strong:#204238;
  --accent-soft:#dde8e1; --border:#d7dbd3; --mono-tint:#f0efe9;
  --pk:#a8632c; --pk-soft:#f3e4d3; --raw:#6b5a9a; --raw-soft:#e7e2f2;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
}
.app{
  display:grid;
  grid-template-columns:280px 1fr;
  min-height:100vh;
}
@media (max-width:820px){
  .app{grid-template-columns:1fr;}
  .sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--border);}
}

/* Sidebar */
.sidebar{
  background:var(--surface);
  border-right:1px solid var(--border);
  padding:28px 20px 40px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
}
.brand{
  font-family:var(--font-display);
  font-size:1.28rem;
  font-weight:600;
  letter-spacing:0.01em;
  line-height:1.25;
  margin:0 0 4px;
  color:var(--text);
}
.brand-sub{
  font-size:0.78rem;
  color:var(--text-muted);
  margin:0 0 22px;
  line-height:1.5;
}
.search{
  width:100%;
  padding:9px 12px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--mono-tint);
  color:var(--text);
  font-family:var(--font-body);
  font-size:0.86rem;
  margin-bottom:22px;
  outline:none;
  transition:border-color .15s ease;
}
.search:focus{border-color:var(--accent);}
.search::placeholder{color:var(--text-muted);}

.group-label{
  font-size:0.68rem;
  text-transform:uppercase;
  letter-spacing:0.09em;
  color:var(--text-muted);
  font-weight:600;
  margin:20px 0 8px;
}
.group-label:first-of-type{margin-top:0;}

.table-btn{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:8px;
  width:100%;
  text-align:left;
  background:none;
  border:none;
  border-radius:7px;
  padding:7px 10px;
  margin:1px 0;
  font-family:var(--font-mono);
  font-size:0.82rem;
  color:var(--text);
  cursor:pointer;
  transition:background .12s ease, color .12s ease;
}
.table-btn:hover{background:var(--surface-2);}
.table-btn.active{
  background:var(--accent-soft);
  color:var(--accent-strong);
  font-weight:600;
}
.table-btn.active.is-raw{background:var(--raw-soft);color:var(--raw);}
.table-btn .count{
  font-family:var(--font-body);
  font-size:0.68rem;
  color:var(--text-muted);
  flex-shrink:0;
}
.table-btn.active .count{color:var(--accent-strong);opacity:0.75;}
.table-btn.active.is-raw .count{color:var(--raw);opacity:0.75;}
.table-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.no-match{color:var(--text-muted);font-size:0.8rem;padding:8px 10px;}

/* Main */
main{
  padding:40px 48px 80px;
  max-width:1080px;
}
@media (max-width:820px){ main{padding:28px 20px 60px;} }

.table-head{margin-bottom:28px;}
.eyebrow{
  font-size:0.72rem;
  text-transform:uppercase;
  letter-spacing:0.1em;
  color:var(--accent);
  font-weight:700;
  margin:0 0 8px;
}
.eyebrow.is-raw{color:var(--raw);}
h1{
  font-family:var(--font-mono);
  font-size:1.9rem;
  font-weight:600;
  margin:0 0 10px;
  color:var(--text);
  text-wrap:balance;
}
.purpose{
  font-size:1rem;
  line-height:1.6;
  color:var(--text);
  max-width:66ch;
  margin:0 0 20px;
}
.meta-row{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:6px;
}
.meta-chip{
  display:flex;
  flex-direction:column;
  gap:2px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:9px;
  padding:9px 14px;
  min-width:150px;
}
.meta-chip.wide{min-width:100%;}
.meta-chip .k{
  font-size:0.65rem;
  text-transform:uppercase;
  letter-spacing:0.07em;
  color:var(--text-muted);
  font-weight:600;
}
.meta-chip .v{
  font-family:var(--font-mono);
  font-size:0.83rem;
  color:var(--text);
  word-break:break-word;
}
.notes-box{
  margin-top:18px;
  padding:12px 16px;
  border-left:3px solid var(--accent);
  background:var(--surface);
  border-radius:0 8px 8px 0;
  font-size:0.88rem;
  line-height:1.55;
  color:var(--text-muted);
}
.notes-box.is-raw{border-left-color:var(--raw);}
.notes-box b{color:var(--text);font-weight:600;}

.lang-toggle{
  display:inline-flex;
  border:1px solid var(--border);
  border-radius:8px;
  overflow:hidden;
  margin-top:18px;
}
.lang-toggle button{
  border:none;
  background:var(--surface);
  color:var(--text-muted);
  font-family:var(--font-body);
  font-size:0.78rem;
  font-weight:600;
  padding:7px 14px;
  cursor:pointer;
  transition:background .12s ease,color .12s ease;
}
.lang-toggle button.active{background:var(--accent);color:#fff;}
.lang-toggle button.active.is-raw{background:var(--raw);}

/* Dictionary table */
.dict-wrap{
  margin-top:26px;
  overflow-x:auto;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--surface);
}
table.dict{
  width:100%;
  border-collapse:collapse;
  font-size:0.86rem;
  min-width:760px;
}
table.dict thead th{
  position:sticky;
  top:0;
  background:var(--surface-2);
  text-align:left;
  font-size:0.68rem;
  text-transform:uppercase;
  letter-spacing:0.07em;
  color:var(--text-muted);
  font-weight:700;
  padding:11px 16px;
  border-bottom:1px solid var(--border);
  white-space:nowrap;
}
table.dict tbody tr{border-bottom:1px solid var(--border);}
table.dict tbody tr:last-child{border-bottom:none;}
table.dict tbody tr:hover{background:var(--surface-2);}
table.dict td{
  padding:12px 16px;
  vertical-align:top;
  line-height:1.5;
  color:var(--text);
}
td.col-name{font-family:var(--font-mono);font-weight:600;white-space:nowrap;}
td.col-name .pk-badge{
  display:inline-block;
  font-family:var(--font-body);
  font-size:0.6rem;
  font-weight:700;
  letter-spacing:0.04em;
  color:var(--pk);
  background:var(--pk-soft);
  border-radius:5px;
  padding:1px 6px;
  margin-left:7px;
  vertical-align:middle;
}
td.col-type{font-family:var(--font-mono);color:var(--text-muted);white-space:nowrap;font-size:0.8rem;}
td.col-role{color:var(--text-muted);white-space:nowrap;font-size:0.82rem;}
td.col-desc{max-width:34ch;color:var(--text);}
td.col-values{font-family:var(--font-mono);font-size:0.78rem;color:var(--text-muted);max-width:26ch;}
td.col-notes{max-width:30ch;color:var(--text-muted);font-size:0.82rem;}

footer.hint{
  margin-top:22px;
  font-size:0.76rem;
  color:var(--text-muted);
}
footer.hint kbd{
  font-family:var(--font-mono);
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:4px;
  padding:1px 5px;
  font-size:0.72rem;
}

.cov-badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:6px;font-size:0.75rem;font-weight:700;
}
.cov-yes{background:var(--accent-soft);color:var(--accent-strong);}
.cov-no{background:var(--surface-2);color:var(--text-muted);}
.cov-note-list{margin:18px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;}
.cov-note-list li{
  position:relative;padding-left:18px;font-size:0.88rem;line-height:1.55;color:var(--text-muted);
}
.cov-note-list li::before{content:"";position:absolute;left:0;top:0.5em;width:6px;height:6px;border-radius:50%;background:var(--accent);}
td.col-votes{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text-muted);font-size:0.82rem;text-align:right;}
th.col-votes-h{text-align:right;}
</style>

<div class="app">
  <nav class="sidebar">
    <p class="brand">Warehouse Data Dictionary</p>
    <p class="brand-sub">MX Elections 2024 &middot; schema reference for every ingested table</p>
    <input class="search" id="search" type="text" placeholder="Filter tables or columns&hellip;" autocomplete="off" />
    <div id="table-list"></div>
  </nav>
  <main id="main"></main>
</div>

<script>
const DATA = {"dim_election": {"columns": [{"Column Name": "election_id", "Data Type": "TEXT", "Role": "Primary key", "Description (SPA)": "Identificador canonico del concurso electoral dentro del warehouse. Permite distinguir el mismo tipo de mesa/casilla entre ciclos y oficinas distintas.", "Description (ENG)": "Canonical election-contest identifier inside the warehouse. It distinguishes the same polling-station/casilla structure across years and offices.", "Values / Domain": "Examples: PRE_1994, PRE_2000, DIP_MR_2000, SEN_MR_2006, DIP_MR_2021, PRE_2024.", "Notes": "Inserted from ELECTION_META in pipeline.py. Also used as the partition/join key in facts and casillas. 18 contests loaded as of 2026-07: PRE/DIP_MR/SEN_MR for 2000, 2006, 2012, 2018, 2024; PRE only for 1994; DIP_MR only for 2015 and 2021. Only MR (first-past-the-post) seats are loaded for DIP/SEN; RP (proporcional representation) is not ingested. See table_dictionaries/README.md for the full coverage matrix."}, {"Column Name": "year", "Data Type": "INTEGER", "Role": "Required attribute", "Description (SPA)": "Año calendario de la eleccion federal.", "Description (ENG)": "Calendar year of the federal election.", "Values / Domain": "1994, 2000, 2006, 2012, 2015, 2018, 2021, 2024.", "Notes": "This is the election year, not the ingestion year."}, {"Column Name": "election_type", "Data Type": "TEXT", "Role": "Required attribute", "Description (SPA)": "Tipo de eleccion normalizado a una clave corta de oficina o camara.", "Description (ENG)": "Normalized short key for the election office or chamber.", "Values / Domain": "PRE, DIP, SEN.", "Notes": "Values come from pipeline metadata and are intentionally compact for filtering."}, {"Column Name": "chamber", "Data Type": "TEXT", "Role": "Nullable attribute", "Description (SPA)": "Camara legislativa asociada al concurso, cuando aplica.", "Description (ENG)": "Legislative chamber associated with the contest, when applicable.", "Values / Domain": "deputies, senate, NULL.", "Notes": "Presidential elections have NULL because they are executive contests, not chamber contests."}, {"Column Name": "seat_method", "Data Type": "TEXT", "Role": "Required attribute", "Description (SPA)": "Metodo de eleccion o asignacion representado por el concurso cargado.", "Description (ENG)": "Election or allocation method represented by the loaded contest.", "Values / Domain": "direct, fptp.", "Notes": "The ingested additions are direct presidential contests or first-past-the-post/MR-style legislative contests."}, {"Column Name": "total_seats", "Data Type": "INTEGER", "Role": "Required attribute", "Description (SPA)": "Numero de cargos o escanos representados por el concurso segun la metadata del pipeline.", "Description (ENG)": "Number of offices or seats represented by the contest according to pipeline metadata.", "Values / Domain": "1 for presidential; 300 for deputies MR-style loads; 96 for senate MR-style loads.", "Notes": "Metadata field; it is not computed from casilla-level results."}, {"Column Name": "term_years", "Data Type": "INTEGER", "Role": "Required attribute", "Description (SPA)": "Duracion legal del cargo en años.", "Description (ENG)": "Legal term length in years.", "Values / Domain": "3 or 6.", "Notes": "Used for descriptive metadata and downstream filtering."}, {"Column Name": "created_at", "Data Type": "TIMESTAMP", "Role": "System field", "Description (SPA)": "Marca de tiempo de insercion generada por SQLite.", "Description (ENG)": "SQLite-generated insertion timestamp.", "Values / Domain": "CURRENT_TIMESTAMP default.", "Notes": "Warehouse-only field; not present in clean parquet inputs."}], "overview": {"Table Name": "dim_election", "Primary Key": "election_id", "Row Grain": "One federal election contest ingested into the warehouse", "Approx. Row Count": "Varies by loaded cycles", "Purpose": "Stores contest-level metadata used to identify year, office/chamber, electoral method, seat count, and term length.", "Key Foreign Keys": "None", "Notes": "Includes presidential, deputies, and senate contests when available. For the current ingested additions: 1994 presidential only; 2000 and 2006 presidential/deputies/senate; 2015 and 2021 deputies only."}}, "dim_geography": {"columns": [{"Column Name": "geo_id", "Data Type": "TEXT", "Role": "Primary key", "Description (SPA)": "Identificador canonico de la combinacion geografica usada para enlazar casillas con entidad, seccion y distrito. Se construye antes de cargar al warehouse para absorber diferencias de formato entre ciclos.", "Description (ENG)": "Canonical identifier for the geography combination used to link polling stations to state, section, and district. It is built before warehouse load to absorb source-format differences across cycles.", "Values / Domain": "Constructed text key from clean parquet geography fields.", "Notes": "The exact construction is cycle-specific in the cleaning scripts, but the warehouse treats it as an opaque stable key."}, {"Column Name": "id_estado", "Data Type": "INTEGER", "Role": "Required natural key", "Description (SPA)": "Clave numerica de la entidad federativa.", "Description (ENG)": "Numeric state identifier.", "Values / Domain": "1-32.", "Notes": "Mapped from source fields such as ID_ESTADO, ID_ENT, ESTADO, or equivalent cleaned columns."}, {"Column Name": "nombre_estado", "Data Type": "TEXT", "Role": "Required attribute", "Description (SPA)": "Nombre de la entidad federativa tal como queda normalizado en el archivo limpio.", "Description (ENG)": "State name as normalized in the clean file.", "Values / Domain": "Mexican federal entities.", "Notes": "Case and accent treatment can differ by source year before normalization; do not use this as the only join key."}, {"Column Name": "seccion", "Data Type": "INTEGER", "Role": "Required natural key", "Description (SPA)": "Seccion electoral asociada a la casilla o acta.", "Description (ENG)": "Electoral section associated with the polling station or acta.", "Values / Domain": "Usually positive integer; special or foreign-vote rows can use 0 in some source cycles.", "Notes": "Important for precinct-level joins. In 2021 source values can appear zero-padded before cleaning."}, {"Column Name": "id_municipio", "Data Type": "INTEGER", "Role": "Nullable natural key", "Description (SPA)": "Clave numerica de municipio cuando el ciclo la provee.", "Description (ENG)": "Numeric municipality identifier when the cycle provides it.", "Values / Domain": "Integer or NULL.", "Notes": "NULL for 1994, 2000, 2006, 2015, and 2021 additions because these ingestions do not provide a reliable numeric municipality key."}, {"Column Name": "municipio", "Data Type": "TEXT", "Role": "Nullable attribute", "Description (SPA)": "Nombre de municipio cuando existe en el archivo limpio del ciclo.", "Description (ENG)": "Municipality name when it exists in the cycle clean file.", "Values / Domain": "Text or NULL.", "Notes": "Present for 1994 and 2006 additions; NULL for 2000, 2015, and 2021 additions."}, {"Column Name": "id_distrito_federal", "Data Type": "INTEGER", "Role": "Nullable natural key", "Description (SPA)": "Distrito electoral federal asociado a la casilla o acta.", "Description (ENG)": "Federal electoral district associated with the polling station or acta.", "Values / Domain": "Positive integer or NULL.", "Notes": "Mapped from DISTRITO, distrito, ID_DISTRITO, or ID_DISTRITO_FEDERAL depending on cycle."}, {"Column Name": "cabecera_distrital_federal", "Data Type": "TEXT", "Role": "Nullable attribute", "Description (SPA)": "Cabecera o nombre distrital cuando el ciclo contiene un campo equivalente.", "Description (ENG)": "District head/seat or district name when the cycle contains an equivalent field.", "Values / Domain": "Text or NULL.", "Notes": "1994 maps CABECERA; 2006 and 2021 map district name; 2000 and 2015 load NULL."}, {"Column Name": "circunscripcion", "Data Type": "INTEGER", "Role": "Nullable attribute", "Description (SPA)": "Circunscripcion electoral cuando el ciclo la provee.", "Description (ENG)": "Electoral circunscription when the cycle provides it.", "Values / Domain": "Integer or NULL.", "Notes": "NULL for the 1994, 2000, 2006, 2015, and 2021 additions."}, {"Column Name": "created_at", "Data Type": "TIMESTAMP", "Role": "System field", "Description (SPA)": "Marca de tiempo de insercion generada por SQLite.", "Description (ENG)": "SQLite-generated insertion timestamp.", "Values / Domain": "CURRENT_TIMESTAMP default.", "Notes": "Warehouse-only field."}], "overview": {"Table Name": "dim_geography", "Primary Key": "geo_id", "Row Grain": "One normalized geography combination used by at least one casilla", "Approx. Row Count": "Varies by loaded cycles", "Purpose": "Stores the geographic keys that can be consistently joined from casilla-level results, even when source cycles expose different geographic detail.", "Key Foreign Keys": "None", "Notes": "The warehouse keeps nullable municipality, district-head, and circunscripcion fields because not every source cycle contains them. 1994 and 2006 include municipality text; 2000 and 2015 do not; 2021 maps district name into cabecera_distrital_federal."}}, "dim_casilla": {"columns": [{"Column Name": "casilla_id", "Data Type": "TEXT", "Role": "Composite primary key component", "Description (SPA)": "Identificador de casilla o acta dentro de un concurso electoral. No debe asumirse globalmente unico sin election_id.", "Description (ENG)": "Polling-station or acta identifier within one election contest. It should not be assumed globally unique without election_id.", "Values / Domain": "Constructed/source-derived text key.", "Notes": "Composite primary key with election_id. For 2021 it is acta-level because CLAVE_ACTA is needed to avoid CLAVE_CASILLA duplicates."}, {"Column Name": "election_id", "Data Type": "TEXT", "Role": "Composite primary key component; foreign key", "Description (SPA)": "Identificador del concurso electoral al que pertenece la casilla o acta.", "Description (ENG)": "Election-contest identifier to which the polling station or acta belongs.", "Values / Domain": "Values from dim_election.election_id.", "Notes": "Also part of the foreign-key path to fact_casilla_vote."}, {"Column Name": "geo_id", "Data Type": "TEXT", "Role": "Foreign key", "Description (SPA)": "Identificador geografico normalizado que ubica la casilla en entidad, seccion y distrito.", "Description (ENG)": "Normalized geography identifier locating the polling station in state, section, and district.", "Values / Domain": "Values from dim_geography.geo_id.", "Notes": "Required join to dim_geography."}, {"Column Name": "id_estado", "Data Type": "INTEGER", "Role": "Required attribute", "Description (SPA)": "Clave numerica de entidad duplicada desde geografia para filtros rapidos y auditoria de carga.", "Description (ENG)": "Numeric state key duplicated from geography for fast filters and load audit.", "Values / Domain": "1-32.", "Notes": "Redundant by design; do not treat differences from dim_geography as valid."}, {"Column Name": "seccion", "Data Type": "INTEGER", "Role": "Required attribute", "Description (SPA)": "Seccion electoral duplicada desde geografia para filtros rapidos y auditoria de carga.", "Description (ENG)": "Electoral section duplicated from geography for fast filters and load audit.", "Values / Domain": "Integer; can be 0 for special foreign-vote rows in some cycles.", "Notes": "Redundant by design; use geo_id for normalized geography joins."}, {"Column Name": "acta_casilla_mec", "Data Type": "TEXT", "Role": "Nullable source/canonical key", "Description (SPA)": "Mejor identificador disponible de acta o casilla mecanizado para el ciclo. Sirve como puente de trazabilidad hacia la fuente limpia.", "Description (ENG)": "Best available machine-readable acta or casilla identifier for the cycle. It provides traceability back to the clean source.", "Values / Domain": "Text or NULL.", "Notes": "1994/2000/2006/2015 map the synthesized c co), 2030 (9 + CDMX)."}, {"Column Name": "local_congress_term_years", "Data Type": "INTEGER", "Role": "Required attribute", "Description (SPA)": "Duracion del periodo de diputados locales.", "Description (ENG)": "Local congress term length in years.", "Values / Domain": "3.", "Notes": "Uniform 3-year term across all states."}, {"Column Name": "next_local_congress_election_years", "Data Type": "TEXT", "Role": "Required attribute", "Description (SPA)": "Años de proxima(s) eleccion(es) de congreso local conocidas.", "Description (ENG)": "Known upcoming local congress election year(s).", "Values / Domain": "Comma-separated years, e.g. '2027' or '2027,2030'.", "Notes": "Local congress elects every 3 years so most states show two upcoming cycles when known."}, {"Column Name": "municipal_term_years", "Data Type": "INTEGER", "Role": "Required attribute", "Description (SPA)": "Duracion del periodo municipal.", "Description (ENG)": "Municipal term length in years.", "Values / Domain": "3.", "Notes": "Uniform 3-year term; CDMX uses alcaldias on the same cadence."}, {"Column Name": "next_municipal_election_years", "Data Type": "TEXT", "Role": "Required attribute", "Description (SPA)": "Años de proxima(s) eleccion(es) municipal(es) conocidas.", "Description (ENG)": "Known upcoming municipal election year(s).", "Values / Domain": "Comma-separated years, e.g. '2027' or '2027,2030'.", "Notes": "Oaxaca has many municipios governed by usos y costumbres, outside party elections."}, {"Column Name": "has_gub_election_2027", "Data Type": "INTEGER", "Role": "Derived attribute", "Description (SPA)": "Bandera que indica si la entidad elige gobernador/a en 2027.", "Description (ENG)": "Flag indicating whether the entity elects a governor in 2027.", "Values / Domain": "1 = yes (17 states), 0 = no.", "Notes": "Convenience column for the 2027 intermediate/midterm cycle query."}, {"Column Name": "notes", "Data Type": "TEXT", "Role": "Nullable attribute", "Description (SPA)": "Notas relevantes sobre el calendario electoral estatal.", "Description (ENG)": "Relevant notes about the state's electoral calendar.", "Values / Domain": "Free text.", "Notes": "Explains term-length exceptions, concurrency with federal elections, usos y costumbres, etc."}, {"Column Name": "source", "Data Type": "TEXT", "Role": "System field", "Description (SPA)": "Fuente de los datos.", "Description (ENG)": "Data source.", "Values / Domain": "Free text.", "Notes": "Synthesized from INE calendars, OPLE sites, and Wikipedia as of 2026-07; exact 2027/2028 dates not yet published by INE (expected Sept 2026)."}, {"Column Name": "created_at", "Data Type": "TIMESTAMP", "Role": "System field", "Description (SPA)": "Marca de tiempo de insercion generada por SQLite.", "Description (ENG)": "SQLite-generated insertion timestamp.", "Values / Domain": "CURRENT_TIMESTAMP default.", "Notes": "Warehouse-only field."}], "overview": null}, "fact_casilla_vote": {"columns": [{"Column Name": "_GOTCHA", "Data Type": "N/A", "Role": "Warehouse-level warning", "Description (SPA)": "ADVERTENCIA: para obtener el total de votos emitidos de una eleccion NO uses SUM(votes) ni COUNT(*) directamente sobre esta tabla.", "Description (ENG)": "WARNING: to get total votes cast for an election, do NOT use SUM(votes) or COUNT(*) directly on this table.", "Values / Domain": "See Notes column for the correct query pattern.", "Notes": "COUNT(*) returns the number of (casilla, party) rows, not votes. SUM(votes) undercounts by 2-4.6% because it excludes num_votos_nulos and num_votos_can_nreg. Those two columns are aggregate-per-casilla values repeated on every party_key row for that casilla, so summing them directly overcounts by ~8-10x (once per party). Correct pattern: first GROUP BY (election_id, casilla_id) taking SUM(votes) as party_votes and MAX(num_votos_nulos), MAX(num_votos_can_nreg) to collapse the per-casilla duplication, THEN sum party_votes + nulos + can_nreg across casillas. Verified against official INE/Wikipedia illa/acta y concurso especificos.", "Description (ENG)": "Votes cast for party_key in the specified polling station/acta and contest.", "Values / Domain": "Non-negative integer; defaults to 0.", "Notes": "This is the core long-format vote measure. It excludes null votes and non-registered candidate votes unless those are modeled as party_key in a source-specific clean file. SUM(votes) alone underestimates total turnout by 2-4.6% -- see _GOTCHA row above for the correct total-votes query pattern."}, {"Column Name": "num_votos_validos", "Data Type": "INTEGER", "Role": "Nullable aggregate measure", "Description (SPA)": "Total de votos validos reportado por la fuente para la casilla/acta, cuando existe como campo agregado separado.", "Description (ENG)": "Total valid votes reported by the source for the polling station/acta, when available as a separate aggregate field.", "Values / Domain": "Non-negative integer or NULL.", "Notes": "Mapped from VALIDOS in 2006. NULL for 1994, 2000, 2015, and 2021 additions because they do not provide that aggregate in the loaded schema."}, {"Column Name": "num_votos_nulos", "Data Type": "INTEGER", "Role": "Nullable aggregate measure", "Description (SPA)": "Total de votos nulos reportado por la fuente para la casilla/acta.", "Description (ENG)": "Total null votes reported by the source for the polling station/acta.", "Values / Domain": "Non-negative integer or NULL.", "Notes": "Mapped from NULOS, VN, NO_VOTOS_NULOS, or VOTOS NULOS depending on cycle normalization. Repeated on every party_key row for the same casilla -- take MAX() per (election_id, casilla_id) before summing, never SUM() directly, or you overcount ~8-10x. See _GOTCHA row above."}, {"Column Name": "num_votos_can_nreg", "Data Type": "INTEGER", "Role": "Nullable aggregate measure", "Description (SPA)": "Total de votos para candidaturas no registradas reportado por la fuente.", "Description (ENG)": "Total votes for non-registered candidates reported by the source.", "Values / const COVERAGE = {"matrix": [{"year": 1994, "PRE": true, "DIP": false, "SEN": false, "votes_pre": 35624845, "votes_dip": null, "votes_sen": null, "verified": {"pre": "~1.0% high vs Wikipedia 35,285,291"}}, {"year": 2000, "PRE": true, "DIP": true, "SEN": true, "votes_pre": 37602057, "votes_dip": 37419381, "votes_sen": 37601618, "verified": {"pre": "within 0.004% of official"}}, {"year": 2006, "PRE": true, "DIP": true, "SEN": true, "votes_pre": 41791322, "votes_dip": 41532165, "votes_sen": 41762918, "verified": {"pre": "exact match to official"}}, {"year": 2012, "PRE": true, "DIP": true, "SEN": true, "votes_pre": 49081853, "votes_dip": 48673937, "votes_sen": 48936154, "verified": {"pre": "~2.1% low vs official 50,143,616"}}, {"year": 2015, "PRE": false, "DIP": true, "SEN": false, "votes_pre": null, "votes_dip": 39872757, "votes_sen": null, "verified": {}}, {"year": 2018, "PRE": true, "DIP": true, "SEN": true, "votes_pre": 56611027, "votes_dip": 56300247, "votes_sen": 56691869, "verified": {"pre": "exact match to official"}}, {"year": 2021, "PRE": false, "DIP": true, "SEN": false, "votes_pre": null, "votes_dip": 49151320, "votes_sen": null, "verified": {}}, {"year": 2024, "PRE": true, "DIP": true, "SEN": true, "votes_pre": 60115184, "votes_dip": 59466442, "votes_sen": 60003726, "verified": {"pre": "exact match to official"}}], "notes": ["18 election contests loaded across 8 federal cycles, every one backed by populated fact_casilla_vote rows — not just dim_election metadata.", "Vote totals here are total votes cast (party votes + null votes + non-registered-candidate votes), not just party-choice votes. Computed by grouping fact_casilla_vote by (election_id, casilla_id) first — see the _GOTCHA row in the fact_casilla_vote dictionary for why a naive SUM(votes) or SUM(num_votos_nulos) gives the wrong answer.", "PRE totals were checked against official INE/Wikipedia figures: 2006, 2018, and 2024 match exactly; 2000 is within 0.004%; 2012 and 1994 are off by ~1-2%, likely from extraordinary/annulled casillas not captured in this dataset.", "Only mayoría relativa (first-past-the-post district) seats are ingested for Diputados and Senado. Representación proporcional (RP) raw source files exist for 2024 (DIPUTACIONES_FED_RP_2024, SENADURIAS_RP_2024) but there is no RP ingestion path yet.", "dim_candidatos is populated for 2015, 2021, and 2024 only.", "The clean parquet layer (data/electoral_data_clean/clean_*) mirrors the db exactly for all 8 cycles — nothing loaded in one layer is missing from the other."]};

let currentTable = ORDER[0];
let lang = "eng"; // 'eng' or 'spa'
let filter = "";

const listEl = document.getElementById("table-list");
const mainEl = document.getElementById("main");
const searchEl = document.getElementById("search");

function isRaw(name){ return !!RAWMETA[name]; }

function tableMatchesFilter(name, q){
  if(!q) return true;
  q = q.toLowerCase();
  if(name.toLowerCase().includes(q)) return true;
  const cols = DATA[name].columns;
  return cols.some(c => (c["Column Name"]||"").toLowerCase().includes(q)
    || (c["Description (ENG)"]||"").toLowerCase().includes(q)
    || (c["Description (SPA)"]||"").toLowerCase().includes(q));
}

function renderList(){
  listEl.innerHTML = "";
  let anyVisible = false;
  for(const [groupName, tables] of Object.entries(GROUPS)){
    const visible = tables.filter(t => tableMatchesFilter(t, filter));
    if(visible.length === 0) continue;
    anyVisible = true;
    const label = document.createElement("div");
    label.className = "group-label";
    label.textContent = groupName;
    listEl.appendChild(label);
    for(const t of visible){
      const raw = isRaw(t);
      const btn = document.createElement("button");
      btn.className = "table-btn" + (t === currentTable ? " active" : "") + (raw && t===currentTable ? " is-raw" : "");
      const label = t === "_coverage" ? "Election coverage" : t;
      const count = t === "_coverage" ? "" : `<span class="count">${DATA[t].columns.length}</span>`;
      btn.innerHTML = `<span>${label}</span>${count}`;
      btn.addEventListener("click", () => { currentTable = t; renderList(); renderMain(); });
      listEl.appendChild(btn);
    }
  }
  if(!anyVisible){
    const p = document.createElement("div");
    p.className = "no-match";
    p.textContent = "No tables match “" + filter + "”.";
    listEl.appendChild(p);
  }
}

function escapeHtml(s){
  if(s === undefined || s === null) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function renderCoverage(){
  let html = "";
  html += `<div class="table-head">`;
  html += `<p class="eyebrow">Overview</p>`;
  html += `<h1>Election coverage</h1>`;
  html += `<p class="purpose">Which federal election contests are actually loaded into the warehouse, cycle by cycle — backed by populated fact_casilla_vote rows, not just dim_election metadata. Vote totals are total votes cast (party + null + non-registered), verified against official INE/Wikipedia figures where noted.</p>`;
  html += `</div>`;

  html += `<div class="dict-wrap"><table class="dict"><thead><tr>
    <th>Year</th><th>President (PRE)</th><th>Deputies MR (DIP)</th><th>Senate MR (SEN)</th>
    <th class="col-votes-h">PRE votes</th><th class="col-votes-h">DIP votes</th><th class="col-votes-h">SEN votes</th>
  </tr></thead><tbody>`;
  const fmt = (n) => n === null ? "—" : n.toLocaleString("en-US");
  const badge = (b) => b ? '<span class="cov-badge cov-yes">&#10003;</span>' : '<span class="cov-badge cov-no">&#8212;</span>';
  for(const row of COVERAGE.matrix){
    const preTitle = row.verified && row.verified.pre ? ` title="${escapeHtml(row.verified.pre)}"` : "";
    html += `<tr>`;
    html += `<td class="col-name">${row.year}</td>`;
    html += `<td>${badge(row.PRE)}</td><td>${badge(row.DIP)}</td><td>${badge(row.SEN)}</td>`;
    html += `<td class="col-votes"${preTitle}>${fmt(row.votes_pre)}</td><td class="col-votes">${fmt(row.votes_dip)}</td><td class="col-votes">${fmt(row.votes_sen)}</td>`;
    html += `</tr>`;
  }
  html += `</tbody></table></div>`;

  html += `<ul class="cov-note-list">` + COVERAGE.notes.map(n => `<li>${escapeHtml(n)}</li>`).join("") + `</ul>`;
  html += `<footer class="hint">18 contests across 8 cycles &middot; source: <kbd>election_data.db</kbd></footer>`;

  mainEl.innerHTML = html;
}

function renderMain(){
  if(currentTable === "_coverage"){ renderCoverage(); return; }
  const entry = DATA[currentTable];
  const ov = entry.overview;
  const raw = RAWMETA[currentTable];
  const descKey = lang === "eng" ? "Description (ENG)" : "Description (SPA)";

  let html = "";
  html += `<div class="table-head">`;
  html += `<p class="eyebrow${raw ? ' is-raw' : ''}">${raw ? 'Raw source reference &middot; cycle ' + raw.cycle : 'Table dictionary'}</p>`;
  html += `<h1>${escapeHtml(currentTable)}</h1>`;

  if(ov){
    html += `<p class="purpose">${escapeHtml(ov["Purpose"])}</p>`;
    html += `<div class="meta-row">`;
    html += `<div class="meta-chip"><span class="k">Primary key</span><span class="v">${escapeHtml(ov["Primary Key"])}</span></div>`;
    html += `<div class="meta-chip"><span class="k">Row grain</span><span class="v">${escapeHtml(ov["Row Grain"])}</span></div>`;
    if(ov["Key Foreign Keys"] && ov["Key Foreign Keys"] !== "None"){
      html += `<div class="meta-chip"><span class="k">Foreign keys</span><span class="v">${escapeHtml(ov["Key Foreign Keys"])}</span></div>`;
    }
    html += `</div>`;
    if(ov["Notes"]){
      html += `<div class="notes-box"><b>Notes.</b> ${escapeHtml(ov["Notes"])}</div>`;
    }
  } else if(raw){
    html += `<p class="purpose">Column-level reference for the raw source layout as received from INE, before normalization into the warehouse (${escapeHtml(raw.election_scope)}).</p>`;
    html += `<div class="meta-row">`;
    html += `<div class="meta-chip"><span class="k">Source file</span><span class="v">${escapeHtml(raw.source_file)}</span></div>`;
    html += `<div class="meta-chip"><span class="k">Delimiter</span><span class="v">${escapeHtml(raw.delimiter)}</span></div>`;
    html += `<div class="meta-chip"><span class="k">Header line</span><span class="v">${escapeHtml(raw.header_line_number)}</span></div>`;
    html += `<div class="meta-chip"><span class="k">Preamble rows</span><span class="v">${escapeHtml(raw.preamble_rows_before_header)}</span></div>`;
    html += `</div>`;
    html += `<div class="meta-row">`;
    html += `<div class="meta-chip wide"><span class="k">Example header</span><span class="v">${escapeHtml(raw.example_header)}</span></div>`;
    html += `</div>`;
    html += `<div class="meta-row">`;
    html += `<div class="meta-chip wide"><span class="k">Example first data row</span><span class="v">${escapeHtml(raw.example_first_data_row)}</span></div>`;
    html += `</div>`;
    if(raw.important_information){
      html += `<div class="notes-box is-raw"><b>Notes.</b> ${escapeHtml(raw.important_information)}</div>`;
    }
  }

  html += `<div class="lang-toggle">
    <button data-lang="eng" class="${lang==='eng'?'active':''}${raw && lang==='eng' ? ' is-raw' : ''}">English</button>
    <button data-lang="spa" class="${lang==='spa'?'active':''}${raw && lang==='spa' ? ' is-raw' : ''}">Espa&ntilde;ol</button>
  </div>`;
  html += `</div>`;

  html += `<div class="dict-wrap"><table class="dict"><thead><tr>
    <th>Column</th><th>Type</th><th>Role</th><th>Description</th><th>Values / Domain</th><th>Notes</th>
  </tr></thead><tbody>`;

  const pk = ov ? String(ov["Primary Key"]||"").split(",").map(s=>s.trim()) : [];

  for(const c of entry.columns){
    const name = c["Column Name"] || "";
    const isPk = pk.includes(name);
    html += `<tr>`;
    html += `<td class="col-name">${escapeHtml(name)}${isPk ? '<span class="pk-badge">PK</span>' : ''}</td>`;
    html += `<td class="col-type">${escapeHtml(c["Data Type"])}</td>`;
    html += `<td class="col-role">${escapeHtml(c["Role"])}</td>`;
    html += `<td class="col-desc">${escapeHtml(c[descKey])}</td>`;
    html += `<td class="col-values">${escapeHtml(c["Values / Domain"])}</td>`;
    html += `<td class="col-notes">${escapeHtml(c["Notes"])}</td>`;
    html += `</tr>`;
  }
  html += `</tbody></table></div>`;

  const srcPath = raw ? `documentation/table_dictionaries/[${raw.cycle}] ${currentTable}` : `documentation/table_dictionaries/${currentTable}.csv`;
  html += `<footer class="hint">${entry.columns.length} columns &middot; source: <kbd>${escapeHtml(srcPath)}</kbd></footer>`;

  mainEl.innerHTML = html;

  mainEl.querySelectorAll(".lang-toggle button").forEach(b => {
    b.addEventListener("click", () => { lang = b.dataset.lang; renderMain(); });
  });
}

searchEl.addEventListener("input", (e) => {
  filter = e.target.value.trim();
  renderList();
});

renderList();
renderMain();
</script>
